<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دروع التكريم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
</head>

<body>

  <div id="page-loader" class="page-loader" aria-hidden="true">
    <div class="page-loader__mark">
      <svg viewBox="0 0 40 46" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="loaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5"/>
            <stop offset="55%" stop-color="#7c3aed"/>
            <stop offset="100%" stop-color="#c9a227"/>
          </linearGradient>
        </defs>
        <path d="M20,2 L36,9 L36,22 C36,33 29,41 20,44 C11,41 4,33 4,22 L4,9 Z" fill="url(#loaderGrad)" stroke="#c9a227" stroke-width="0.6"/>
        <text x="20" y="27" text-anchor="middle" font-family="Amiri, serif" font-weight="700" font-size="19" fill="#f8fafc">م</text>
      </svg>
    </div>
    <p class="page-loader__text">دروع التكريم</p>
  </div>

  <div class="floaters" id="floaters"></div>

  <header class="site-header">
    <a class="brand" href="#top">
      <svg class="brand-mark" viewBox="0 0 40 46" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5"/>
            <stop offset="55%" stop-color="#7c3aed"/>
            <stop offset="100%" stop-color="#c9a227"/>
          </linearGradient>
        </defs>
        <path d="M20,2 L36,9 L36,22 C36,33 29,41 20,44 C11,41 4,33 4,22 L4,9 Z" fill="url(#brandGrad)" stroke="#c9a227" stroke-width="0.6"/>
        <text x="20" y="27" text-anchor="middle" font-family="Amiri, serif" font-weight="700" font-size="19" fill="#f8fafc">م</text>
      </svg>
      <span class="brand-name">شركة ميم</span>
    </a>

    <a class="header-contact" id="header-contact" href="#">
      <span class="header-contact__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.86 19.86 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.86 19.86 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
      </span>
      <span class="header-contact__text">
        <strong id="header-contact-name">محمد رضا</strong>
        <span id="header-contact-phone"></span>
      </span>
    </a>
  </header>

  <section class="hero" id="top">
    <div class="hero-copy">
      <p class="kicker">مجموعة الدروع الفاخرة</p>
      <h1>نحتفي<br><span>بكل إنجاز</span></h1>
      <p class="hero-description">مجموعة مختارة من دروع التكريم الفاخرة، صُمّمت لتمنح كل لحظة إنجاز حضورًا يليق بها.</p>
      <div class="hero-actions">
        <a class="hero-cta" href="#grid">استكشف المجموعة <span aria-hidden="true">←</span></a>
        <a class="hero-secondary" href="#grid">اكتشف تصاميمنا</a>
      </div>
    </div>
    <div class="hero-stack" aria-label="نماذج من مجموعة الدروع التكريمية">
      <figure class="hero-card hero-card--back-left" tabindex="0">
        <img src="images/acrylic-2.webp" alt="درع أكريليك محفور" loading="lazy" decoding="async">
      </figure>
      <figure class="hero-card hero-card--back-right" tabindex="0">
        <img src="images/gold-4.webp" alt="درع ذهبي ملكي" loading="lazy" decoding="async">
      </figure>
      <figure class="hero-card hero-card--middle-left" tabindex="0">
        <img src="images/crystal-7.webp" alt="درع كريستالي" loading="lazy" decoding="async">
      </figure>
      <figure class="hero-card hero-card--middle-right" tabindex="0">
        <img src="images/acrylic-4.webp" alt="لوحة أكريليك للتقدير" loading="lazy" decoding="async">
      </figure>
      <figure class="hero-card hero-card--front" tabindex="0">
        <span class="hero-featured__label">FEATURED PIECE</span>
        <img src="images/crystal-1.webp" alt="درع تكريمي كريستالي مميز" fetchpriority="high" decoding="async">
      </figure>
    </div>
  </section>

  <div class="filter-bar">
    <nav class="filters" id="filters"></nav>
    <p class="count" id="count"></p>
  </div>

  <main class="grid" id="grid"></main>

  <div class="product-modal" id="product-modal" hidden>
    <div class="product-modal__backdrop" data-modal-close></div>
    <section class="product-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modal-product-name">
      <button class="product-modal__close" type="button" aria-label="إغلاق" data-modal-close>&times;</button>
      <button class="product-modal__nav product-modal__nav--prev" type="button" id="modal-prev" aria-label="المنتج السابق">‹</button>
      <button class="product-modal__nav product-modal__nav--next" type="button" id="modal-next" aria-label="المنتج التالي">›</button>
      <img class="product-modal__image" id="modal-product-image" alt="">
      <div class="product-modal__content">
        <p class="product-modal__material" id="modal-product-material"></p>
        <p class="product-modal__counter" id="modal-product-counter"></p>
        <h2 id="modal-product-name"></h2>
        <p class="product-modal__code" id="modal-product-code"></p>
        <a class="product-modal__whatsapp" id="modal-product-whatsapp" target="_blank" rel="noopener noreferrer">
          تواصل عبر WhatsApp
        </a>
      </div>
    </section>
  </div>

  <button class="scroll-top" id="scroll-top" type="button" aria-label="العودة إلى أعلى الصفحة">
    <span aria-hidden="true">↑</span>
  </button>

  <footer>
    <p>© جميع الحقوق محفوظة لـ <span id="account-name" style="color: blueviolet; font-weight: 800;">محمد رضا شركه ميم </span></p>
  </footer>
  <script src="js/script.js"></script>
</body>
</html>
